<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Maquinaria</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <!-- CSS del proyecto -->
    <link rel="stylesheet" href="./assets/style.css?v=mobile-20261011-1">

</head>

<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <main class="container px-2 px-sm-3 pb-4">

        <div class="container px-0 px-sm-2 py-3 py-md-4">

            <!-- Título -->
            <div class="text-center mb-4">

                <h1>Maquinaria</h1>

                <h5>
                    Gestión de maquinaria básica
                </h5>

            </div>

            <!-- Buscador y botón de alta -->
            <div class="row gx-0 gx-sm-3 mb-4">

                <div class="col-12 col-md-8 mb-2">

                    <input type="text" id="buscarMaquinaria" class="form-control"
                        placeholder="Buscar maquinaria por nombre...">

                </div>

                <div class="col-12 col-md-4 text-md-end d-grid d-md-block">

                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#altaMaquinariaModal">Registrar maquinaria</button>

                </div>

            </div>

            <!-- Tabla -->
            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h2 class="h5 mb-0">
                        Lista de Maquinaria
                    </h2>

                </div>

                <div class="card-body p-2 p-sm-3">

                    <div class="table-responsive" tabindex="0" role="region" aria-label="Listado con desplazamiento horizontal">

                        <table class="table table-striped table-hover align-middle">

                            <thead>

                                <tr>

                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Tipo</th>
                                    <th>Estado</th>
                                    <th>Centro</th>
                                    <th>Acciones</th>

                                </tr>

                            </thead>

                            <tbody id="tablaMaquinarias">

                                <!-- Las maquinarias se cargarán desde JavaScript -->

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>
        <div class="modal fade" id="datosMaquinaria" tabindex="-1" aria-hidden="true">

            <div class="modal-dialog modal-dialog-scrollable">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Datos de la Maquinaria
                        </h5>

                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar">
                        </button>

                    </div>

                    <div class="modal-body">

                        <div class="mb-3">

                            <label for="verNombreMaquinaria" class="form-label">
                                Nombre
                            </label>

                            <input type="text" id="verNombreMaquinaria" class="form-control" disabled>

                        </div>

                        <div class="mb-3">

                            <label for="verTipoMaquinaria" class="form-label">
                                Tipo
                            </label>

                            <select id="verTipoMaquinaria" class="form-select" disabled>

                                <option value="Aplanadora">
                                    Aplanadora
                                </option>

                                <option value="Bobcat">
                                    Bobcat
                                </option>

                                <option value="Retroexcavadora">
                                    Retroexcavadora
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label for="verEstadoMaquinaria" class="form-label">
                                Estado
                            </label>

                            <select id="verEstadoMaquinaria" class="form-select" disabled>

                                <option value="Disponible">
                                    Disponible
                                </option>

                                <option value="Inhabilitado">
                                    Inhabilitado
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label for="verIdCentroMaquinaria" class="form-label">
                                Centro
                            </label>

                            <select id="verIdCentroMaquinaria" class="form-select" disabled>
                                <option value="">Cargando centros...</option>
                            </select>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                            Cerrar

                        </button>

                        <button type="button" id="btnGuardarMaquinaria" class="btn btn-success d-none">

                            Guardar cambios

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <div class="modal fade" id="altaMaquinariaModal" tabindex="-1" aria-labelledby="altaMaquinariaModalLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h2 class="modal-title fs-5" id="altaMaquinariaModalLabel">Registrar maquinaria</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-start">
<form data-alta="altaMaquinaria" id="formMaquinaria">

                        <!-- Nombre -->
                        <div class="mb-3">

                            <label for="altaMaquinaria_nombreMaquinaria" class="form-label">
                                Nombre
                            </label>

                            <input type="text"
                                id="altaMaquinaria_nombreMaquinaria"
                                name="nombre"
                                class="form-control"
                                maxlength="60"
                                required>

                        </div>

                        <!-- Tipo -->
                        <div class="mb-3">

                            <label for="altaMaquinaria_tipoMaquinaria" class="form-label">
                                Tipo
                            </label>

                            <select id="altaMaquinaria_tipoMaquinaria"
                                name="tipo"
                                class="form-select"
                                required>

                                <option value="">
                                    Seleccione un tipo
                                </option>

                                <option value="Aplanadora">
                                    Aplanadora
                                </option>

                                <option value="Bobcat">
                                    Bobcat
                                </option>

                                <option value="Retroexcavadora">
                                    Retroexcavadora
                                </option>

                            </select>

                        </div>

                        <!-- Estado -->
                        <div class="mb-3">

                            <label for="altaMaquinaria_estadoMaquinaria" class="form-label">
                                Estado
                            </label>

                            <select id="altaMaquinaria_estadoMaquinaria"
                                name="estado"
                                class="form-select"
                                required>

                                <option value="">
                                    Seleccione un estado
                                </option>

                                <option value="Disponible">
                                    Disponible
                                </option>

                                <option value="Inhabilitado">
                                    Inhabilitado
                                </option>

                            </select>

                        </div>

                        <!-- Centro -->
                        <div class="mb-3">

                            <label for="altaMaquinaria_idCentroMaquinaria" class="form-label">
                                Centro
                            </label>

                            <select id="altaMaquinaria_idCentroMaquinaria"
                                name="idCentro"
                                class="form-select"
                                required>

                                <option value="">
                                    Seleccione un centro
                                </option>

                            </select>
                            <div id="altaMaquinaria_mensajeCentrosMaquinaria" class="form-text"></div>

                        </div>

                        <!-- Botones -->
                        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">

                            <button type="submit"
                                class="btn btn-success">

                                Registrar maquinaria

                            </button>

                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>

                        </div>

                    <div class="alert alert-danger d-none mt-3 mb-0" data-alta-error role="alert"></div>
</form>
                </div>
            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous">
    </script>

    <!-- JavaScript del proyecto -->
    <script src="assets/script.js?v=flota-20261011-1"></script>

</body>

</html>
