<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="assets/style.css?v=mobile-20261011-1">

</head>

<body class="d-flex flex-column">
    
    <div id="navbar-container"></div>

    <main>
        <div class="container-fluid px-2 px-md-4 mb-3 d-flex justify-content-end"><button type="button" id="agregarContenedorMapa" class="btn btn-primary" aria-controls="altaContenedorPanel" aria-expanded="false">Agregar contenedor</button></div>
        <div class="container-fluid px-2 px-md-4 pb-4">

            <div class="row g-3">

                <div id="columnaMapaContenedores" class="col-12 col-lg-8">

                    <div id="mapa"></div>

                </div>

                <div class="col-12 col-lg-4">
<section id="altaContenedorPanel" data-alta-panel class="card text-start d-none" aria-labelledby="altaContenedorPanelLabel">
<div class="card-header bg-success text-white"><h2 id="altaContenedorPanelLabel" class="h5 mb-0">Agregar contenedor</h2></div>
<div class="card-body"><form data-alta="altaContenedor" id="formContenedor" method="POST" action="http://localhost:8000/api/contenedores">
<div id="ayudaUbicacionAlta" class="alert alert-info py-2" role="status">Seleccione un punto del mapa para cargar la ubicación del contenedor.</div>

                                <div class="row">
                                    <div class="col-12 col-sm-6 col-lg-12 col-xl-6 mb-3">
                                        <label for="altaContenedor_ubicacionX" class="form-label">
                                            Ubicación X
                                        </label>

                                        <input type="number" class="form-control" id="altaContenedor_ubicacionX" name="ubicacionX"
                                            placeholder="Seleccione un punto del mapa" aria-describedby="ayudaUbicacionAlta" readonly min="-99.9999" max="99.9999" step="0.0001" required>
                                    </div>

                                    <div class="col-12 col-sm-6 col-lg-12 col-xl-6 mb-3">
                                        <label for="altaContenedor_ubicacionY" class="form-label">
                                            Ubicación Y
                                        </label>

                                        <input type="number" class="form-control" id="altaContenedor_ubicacionY" name="ubicacionY"
                                            placeholder="Seleccione un punto del mapa" aria-describedby="ayudaUbicacionAlta" readonly min="-99.9999" max="99.9999" step="0.0001" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-12 col-sm-6 col-lg-12 col-xl-6 mb-3">
                                        <label for="altaContenedor_estado" class="form-label">
                                            Estado
                                        </label>

                                        <select class="form-select" id="altaContenedor_estado" name="estado" required>
                                            <option value="" selected disabled> Seleccione estado</option>
                                            <option value="Disponible">Disponible</option>
                                            <option value="En mantenimiento">En mantenimiento</option>
                                            <option value="Inhabilitado">Inhabilitado</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-sm-6 col-lg-12 col-xl-6 mb-3">
                                        <label for="altaContenedor_nivelLlenado" class="form-label">
                                            Nivel de llenado
                                        </label>

                                        <div class="input-group">
                                            <input type="number" class="form-control" id="altaContenedor_nivelLlenado"
                                                name="nivelLlenado" value="0" min="0" max="0" readonly required>
                                            <span class="input-group-text">%</span>
                                        </div>
                                    </div>
                                </div>


                                <div class="mb-3">
                                    <label for="altaContenedor_tipoResiduo" class="form-label">
                                        Tipo de residuo
                                    </label>

                                    <select class="form-select" id="altaContenedor_tipoResiduo" name="tipoResiduo" required>
                                        <option value="" selected disabled> Seleccione el tipo de residuo </option>
                                        <option value="Mixtos">Mixtos</option>
                                        <option value="Reciclables">Reciclables</option>
                                    </select>
                                </div>


                                <div class="mb-4">
                                    <label for="altaContenedor_idRuta" class="form-label">
                                        Ruta asignada
                                    </label>

                                    <select class="form-select" id="altaContenedor_idRuta" name="idRuta">
                                        <option value="" selected>Sin ruta asignada</option>
                                    </select>
                                    <div id="altaContenedor_mensajeRutas" class="form-text"></div>
                                </div>


                                <div class="d-flex flex-column flex-sm-row justify-content-sm-end gap-2">
                                    <button type="button" class="btn btn-secondary" id="cancelarAltaMapa">Cancelar</button>
<button type="submit" class="btn btn-primary">
                                        Agregar contenedor
                                    </button>
                                </div>

                            <div class="alert alert-danger d-none mt-3 mb-0" data-alta-error role="alert"></div>
</form>
</div></section>

                    <div id="infoContenedor" class="text-start">
                        <div id="avisoUbicacionEdicion" class="alert alert-info mx-3 mt-3 d-none" role="status">Seleccione un punto del mapa para cambiar la ubicación del contenedor.</div>

                        <div class="container mt-3">
                            <div class="form-group mb-3">
                                <label for="id">ID:</label>
                                <input type="text" class="datos form-control" id="id" readonly>
                            </div>
                            <div class="form-group mb-3">
                                <label for="Nv_Llenado">Nivel de Llenado:</label>
                                <input type="number" class="datos form-control" id="Nv_Llenado" min="0" max="100" step="0.01" required readonly>
                            </div>
                            <div class="form-group mb-3">
                                <label for="ubiX">Ubicacion X:</label>
                                <input type="text" class="datos form-control" id="ubiX" aria-describedby="avisoUbicacionEdicion" readonly>
                            </div>
                            <div class="form-group mb-3">
                                <label for="ubiY">Ubicacion Y:</label>
                                <input type="text" class="datos form-control" id="ubiY" aria-describedby="avisoUbicacionEdicion" readonly>
                            </div>
                            <div class="form-group mb-3">
                                <label for="Ruta">Ruta:</label>
                                <select class="datos form-select" id="Ruta" disabled>
                                    <option value="">Sin ruta asignada</option>
                                </select>
                            </div>
                            <div class="form-group mb-3">
                                <label for="Tipo_Residuo">Tipo Residuos:</label>
                                <select class="datos form-select" id="Tipo_Residuo" disabled>
                                    <option value="Mixtos">Mixtos</option>
                                    <option value="Reciclables">Reciclables</option>
                                </select>
                            </div>
                        </div>
                        <div class="container mt-3 d-flex flex-column flex-sm-row gap-2">
                            <button type="button" id="btnEditar" class="btn btn-secondary" disabled>Editar</button>
                            <button type="button" id="btnCancelarEdicionContenedor" class="btn btn-outline-secondary d-none">Cancelar</button>
                            <button type="button" id="btnEliminar" class="guardar btn btn-danger" disabled>Eliminar</button>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/script.js?v=flota-20261011-1"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


</body>

</html>
