<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="assets/style.css">

</head>

<body class="d-flex flex-column">
    
    <div id="navbar-container"></div>

    <main>
        <div class="container-fluid px-4">

            <div class="row">

                <div class="col-8">

                    <div id="mapa"></div>

                </div>

                <div class="col-4">

                    <div id="infoContenedor">

                        <div class="container mt-3">
                            <div class="form-group">
                                <label for="id">ID:</label>
                                <input type="text" class="datos form-control" id="id" readonly>
                            </div>
                            <div class="form-group">
                                <label for="Nv_Llenado">Nivel de Llenado:</label>
                                <input type="text" class="datos form-control" id="Nv_Llenado" readonly>
                            </div>
                            <div class="form-group">
                                <label for="ubiX">Ubicacion X:</label>
                                <input type="text" class="datos form-control" id="ubiX" readonly>
                            </div>
                            <div class="form-group">
                                <label for="ubiY">Ubicacion Y:</label>
                                <input type="text" class="datos form-control" id="ubiY" readonly>
                            </div>
                            <div class="form-group">
                                <label for="Ruta">Ruta:</label>
                                <input type="text" class="datos form-control" id="Ruta" readonly>
                            </div>
                            <div class="form-group">
                                <label for="Tipo_Residuo">Tipo Residuos:</label>
                                <input type="text" class="datos form-control" id="Tipo_Residuo" readonly>
                            </div>
                        </div>
                        <div class="container mt-3">
                            <button type="button" class="btn btn-secondary">Editar</button>
                            <button type="button" class="guardar btn btn-danger">Eliminar</button>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


</body>

</html>
