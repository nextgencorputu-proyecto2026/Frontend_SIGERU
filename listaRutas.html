<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas | SIGERU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="assets/style.css?v=mobile-20261011-1">
</head>
<body class="d-flex flex-column">
    <div id="navbar-container"></div>
    <main class="container-fluid px-2 px-md-4 pb-4">
        <h1 class="h2 text-center mb-4">RUTAS</h1>
        <div class="row g-3 align-items-start" id="distribucionRutas">
            <section id="columnaListaRutas" class="col-12 col-lg-4 text-start" aria-labelledby="tituloListaRutas">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h2 id="tituloListaRutas" class="h5 mb-0">Listado de rutas</h2>
                    </div>
                    <div class="card-body">
                        <label for="buscarRuta" class="form-label">Buscar ruta</label>
                        <input id="buscarRuta" class="form-control mb-3" type="search" placeholder="ID o descripción">
                        <div id="listaRutas" class="list-group gap-2 mb-3" aria-label="Rutas disponibles"></div>
                        <nav aria-label="Paginación de rutas" class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                            <button id="paginaAnteriorRutas" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Página anterior" disabled>Anterior</button>
                            <span id="paginaActualRutas" class="small" aria-live="polite">Página 1 de 1</span>
                            <button id="paginaSiguienteRutas" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Página siguiente" disabled>Siguiente</button>
                        </nav>
                        <div class="d-grid gap-2">
                            <button id="nuevaRuta" class="btn btn-success" type="button" aria-controls="columnaFormularioRuta" aria-expanded="false">Nueva ruta</button>
                            <button id="mostrarTodasRutas" class="btn btn-outline-primary" type="button">Mostrar todas en el mapa</button>
                        </div>
                        <div class="row g-2 mt-1">
                            <div class="col-6"><button id="editarRuta" class="btn btn-secondary w-100" type="button" aria-controls="columnaFormularioRuta" disabled>Editar</button></div>
                            <div class="col-6"><button class="btn btn-danger w-100" type="button" disabled>Eliminar</button></div>
                        </div>
                    </div>
                </div>
            </section>
            <section id="columnaMapaRutas" class="col-12 col-lg-8 text-start" aria-labelledby="tituloMapaRutas">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white"><h2 id="tituloMapaRutas" class="h5 mb-0">Mapa de rutas</h2></div>
                    <div class="card-body p-2 p-sm-3">
                        <div class="ratio ratio-4x3"><div id="mapaRutas" class="rounded border" aria-label="Mapa de los contenedores asignados a rutas"></div></div>
                        <p id="detalleMapaRutas" class="form-text mt-2 mb-2" role="status">Al ingresar se muestran todas las rutas disponibles. Seleccione una para destacar sus contenedores.</p>
                        <div id="leyendaRutas" class="d-flex flex-wrap gap-2" aria-label="Leyenda de rutas"></div>
                    </div>
                </div>
            </section>
            <section id="columnaFormularioRuta" class="col-12 col-lg-3 text-start d-none" aria-labelledby="tituloFormularioRuta">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center gap-2">
                        <h2 id="tituloFormularioRuta" class="h5 mb-0">Nueva ruta</h2>
                        <button id="cerrarFormularioRuta" class="btn-close btn-close-white" type="button" aria-label="Cerrar formulario"></button>
                    </div>
                    <div class="card-body">
                        <p id="estadoGuardadoRuta" class="form-text" role="status">El guardado de rutas aún no está disponible.</p>
                        <form id="formRuta">
                            <div class="mb-3"><label for="descripcionRuta" class="form-label">Descripción</label><input id="descripcionRuta" name="descripcion" class="form-control" type="text" maxlength="120" placeholder="Nombre o descripción de la ruta" required></div>
                            <div class="mb-3"><label for="horarioRuta" class="form-label">Horario</label><input id="horarioRuta" name="horario" class="form-control" type="text" placeholder="Ej.: 08:00 a 12:00" required></div>
                            <div class="mb-3"><label for="tipoResiduoRuta" class="form-label">Tipo de residuo</label><select id="tipoResiduoRuta" name="tipoResiduo" class="form-select" required><option value="">Seleccione un tipo</option><option value="Mixtos">Mixtos</option><option value="Reciclables">Reciclables</option></select></div>
                            <div class="mb-3"><label for="contenedoresRuta" class="form-label">Contenedores asignados</label><input id="contenedoresRuta" class="form-control" type="text" value="0" readonly></div>
                            <div class="mb-3"><label for="identificadorRuta" class="form-label">Identificador</label><input id="identificadorRuta" class="form-control" type="text" placeholder="Se asignará al guardar" readonly></div>
                            <div class="d-grid gap-2">
                                <button id="guardarRuta" class="btn btn-success" type="submit" disabled aria-describedby="estadoGuardadoRuta">Guardar</button>
                                <button id="cancelarRuta" class="btn btn-secondary" type="button">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/script.js?v=rutas-sin-avisos-20261012-2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
