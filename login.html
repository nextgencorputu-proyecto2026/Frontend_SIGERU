<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css?v=mobile-20261011-1">
</head>

<body class="d-flex align-items-center justify-content-center py-4 px-3">

    <form id="formLogin" action="http://localhost:8000/api/auth/login"
        class="container col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4 card border-0 shadow-sm p-3 p-sm-4 d-flex flex-column align-items-center">
        <img id="logoLogin" src="img/Logo SIGERU minimalista.png" alt="Logo" class="img-fluid d-none d-md-block mx-auto mb-3">
        <h1 class="h3 text-center mb-4">INICIAR SESIÓN</h1>

        <div class="col-12 form-floating mb-3">
            <input type="email" class="form-control rounded-3" id="Email" name="email"
                placeholder="Email" autocomplete="username" required>
            <label for="Email">Email</label>
        </div>
        <div class="col-12 form-floating mb-3">
            <input type="password" class="form-control rounded-3" id="Password" name="password"
                placeholder="Password" autocomplete="current-password" required>
            <label for="Password">Contraseña</label>
        </div>
        <div class="col-12 d-flex justify-content-end">
            <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
        </div>

    </form>

    <script src="assets/script.js?v=flota-20261011-1"></script>

</body>

</html>
