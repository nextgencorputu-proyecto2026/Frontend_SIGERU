<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado Camiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/style.css">

</head>

<body class="d-flex flex-column">
    
    <div id="navbar-container"></div>

    <main class="container">
        <h2 class="text-center">CAMIONES</h2>

        <!-- barra de busqueda -->
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid justify-content-center">
                <form id="formBusquedaCamiones" class="d-flex" role="search">
                    <input id="inputMatricula" class="form-control me-2" type="search" placeholder="Matricula" aria-label="Matricula" />
                    <button id="buscarCamiones" class="btn btn-outline-success" type="submit" method="GET">Buscar</button>
                </form>
            </div>
        </nav>

        <!-- Tabla -->
        <table class="table table-hover">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">MATRICULA</th>
                    <th scope="col">TIPO</th>
                    <th scope="col">RUTA ASIGNADA</th>
                    <th scope="col">ESTADO</th>
                    <th scope="col">OPCIONES</th>
                </tr>
            </thead>
            <tbody id="tablaCamiones">

                <!-- Cargaremos los datos mediante API -->

            </tbody>
        </table>

        <div class="container">

    <!-- Ventana emergente -->
    <div class="modal fade" id="datosCamiones" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Datos Camión</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="matricula">Matrícula:</label>
                        <input type="text" class="datos form-control" id="matricula" readonly>
                    </div>
                    <div class="form-group">
                        <label for="tipo">Tipo:</label>
                        <input type="text" class="datos form-control" id="tipo" readonly>
                    </div>
                    <div class="form-group">
                        <label for="ruta">Ruta Asignada:</label>
                        <input type="text" class="datos form-control" id="ruta" readonly>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado:</label>
                        <input type="text" class="datos form-control" id="estado" readonly>
                    </div>
                    <div class="form-group">
                        <label for="capacidad">Capacidad:</label>
                        <input type="text" class="datos form-control" id="capacidad" readonly>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="guardar btn btn-primary d-none">Guardar</button>
                </div>
            </div>
        </div>
    </div>

</div>

    </main>

    <script src="assets/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


</body>

</html>
