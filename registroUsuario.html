<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./assets/style.css">

</head>

<body class="d-flex flex-column">

    <div id="navbar-container"></div>

    <main class="container">

        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">

                    <div class="card shadow">
                        <div class="card-header bg-success text-white">
                            <h2 class="h4 mb-0">Registrar Usuario</h2>
                        </div>

                        <div class="card-body">
                            <form id="formRegistroUsuario" method="POST" action="http://127.0.0.1:8000/api/usuarios">

                                <div class="mb-3">
                                    <label for="ci" class="form-label">Cédula</label>
                                    <input type="text" class="form-control" id="ci" name="ci" placeholder="12345678"
                                        required>
                                </div>

                                <div class="mb-3">
                                    <label for="nombre1" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre1" name="nombre1"
                                        placeholder="Nombre" required>
                                </div>

                                <div class="mb-3">
                                    <label for="nombre2" class="form-label">Segundo nombre (opcional)</label>
                                    <input type="text" class="form-control" id="nombre2" name="nombre2"
                                        placeholder="Segundo nombre">
                                </div>

                                <div class="mb-3">
                                    <label for="apellido1" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="apellido1" name="apellido1"
                                        placeholder="Apellido" required>
                                </div>

                                <div class="mb-3">
                                    <label for="apellido2" class="form-label">Segundo apellido</label>
                                    <input type="text" class="form-control" id="apellido2" name="apellido2"
                                        placeholder="Segundo apellido" required>
                                </div>

                                <div class="mb-3">
                                    <label for="fec_nac" class="form-label">Fecha de nacimiento</label>
                                    <input type="date" class="form-control" id="fec_nac" name="fec_nac" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="email@ejemplo.com" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <button type="submit" class="btn btn-primary">Registrar Usuario</button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="assets/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
