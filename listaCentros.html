<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Centros</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!-- CSS del proyecto -->
    <link rel="stylesheet" href="./assets/style.css?v=mobile-20261011-1">

</head>

<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <main class="container-fluid px-3 px-lg-4 pb-4">
        <div class="text-center mb-4">
            <h1>Centros de Acopio</h1>
            <h5>Gestión de centros de acopio y otros centros</h5>
        </div>
        <div class="row g-4 text-start">
            <section class="col-12 col-lg-6" aria-labelledby="tituloListaCentros">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-success text-white d-flex flex-wrap align-items-center justify-content-between gap-2">
                        <h2 class="h5 mb-0" id="tituloListaCentros">Lista de centros</h2>
                        <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#altaCentroModal">Registrar centro</button>
                    </div>
                    <div class="card-body p-2 p-sm-3">
                        <label for="buscarCentro" class="form-label">Buscar por nombre</label>
                        <input type="search" id="buscarCentro" class="form-control mb-3" placeholder="Nombre del centro...">
                        <div class="table-responsive" tabindex="0" role="region" aria-label="Listado de centros">
                            <table class="table table-striped table-hover align-middle mb-0">
                                <thead><tr><th>Nombre</th><th>Dirección</th><th>Capacidad</th><th>Tipo</th><th>Acciones</th></tr></thead>
                                <tbody id="tablaCentros"><tr><td colspan="5" class="text-center text-body-secondary">Cargando centros...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
            <section class="col-12 col-lg-6" aria-labelledby="tituloMapaCentros">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-success text-white"><h2 class="h5 mb-0" id="tituloMapaCentros">Ubicación de los centros</h2></div>
                    <div class="card-body p-2 p-sm-3">
                        <p class="small text-body-secondary">Seleccioná un marcador para ver el centro. La búsqueda también filtra el mapa.</p>
                        <div class="ratio ratio-1x1"><div id="mapaCentros" class="rounded" role="region" aria-label="Mapa de centros de acopio"></div></div>
                        <p id="estadoMapaCentros" class="small text-body-secondary mt-2 mb-0" role="status"></p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div class="modal fade" id="altaCentroModal" tabindex="-1" aria-labelledby="altaCentroModalLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h2 class="modal-title fs-5" id="altaCentroModalLabel">Registrar centro</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-start">
<form data-alta="altaCentro" id="formCentro" method="POST"
                                action="http://localhost:8000/api/centros-acopio">

                                <div class="row">

                                    <div class="col-12 col-md-6 mb-3">

                                        <label for="altaCentro_nombre" class="form-label">
                                            Nombre
                                        </label>

                                        <input type="text"
                                            class="form-control"
                                            id="altaCentro_nombre"
                                            name="nombre"
                                            placeholder="Nombre del centro"
                                            maxlength="60"
                                            required>

                                    </div>

                                    <div class="col-12 col-md-6 mb-3">

                                        <label for="altaCentro_direccion" class="form-label">
                                            Dirección
                                        </label>

                                        <input type="text"
                                            class="form-control"
                                            id="altaCentro_direccion"
                                            name="direccion"
                                            placeholder="Dirección"
                                            maxlength="120"
                                            required>

                                    </div>

                                </div>


                                <div class="row">

                                    <div class="col-12 col-md-6 mb-3">

                                        <label for="altaCentro_capacidad" class="form-label">
                                            Capacidad
                                        </label>

                                        <div class="input-group">

                                            <input type="number"
                                                class="form-control"
                                                id="altaCentro_capacidad"
                                                name="capacidad"
                                                placeholder="Ingrese la capacidad"
                                                min="0.01"
                                                step="0.01"
                                                required>

                                            <span class="input-group-text">
                                                kg
                                            </span>

                                        </div>

                                    </div>


                                    <div class="col-12 col-md-6 mb-3">

                                        <label for="altaCentro_tipo" class="form-label">
                                            Tipo de centro
                                        </label>

                                        <select class="form-select"
                                            id="altaCentro_tipo"
                                            name="tipo"
                                            required>

                                            <option value="" selected disabled>
                                                Seleccione un tipo
                                            </option>

                                            <option value="Central Operativa">
                                                Central Operativa
                                            </option>

                                            <option value="Centro de acopio">
                                                Centro de acopio
                                            </option>

                                            <option value="Punto de depósito">
                                                Punto de depósito
                                            </option>

                                            <option value="Vertedero">
                                                Vertedero
                                            </option>

                                        </select>

                                    </div>

                                </div>


                                <div class="row">

                                    <div class="col-12 col-md-6 mb-3">

                                        <label for="altaCentro_ubicacionX" class="form-label">
                                            Ubicación X
                                        </label>

                                        <input type="number"
                                            class="form-control"
                                            id="altaCentro_ubicacionX"
                                            name="ubicacionX"
                                            placeholder="Ej: -34.8897"
                                            step="any"
                                            required>

                                    </div>


                                    <div class="col-12 col-md-6 mb-3">

                                        <label for="altaCentro_ubicacionY" class="form-label">
                                            Ubicación Y
                                        </label>

                                        <input type="number"
                                            class="form-control"
                                            id="altaCentro_ubicacionY"
                                            name="ubicacionY"
                                            placeholder="Ej: -56.0960"
                                            step="any"
                                            required>

                                    </div>

                                </div>


                                <div class="d-flex flex-column flex-sm-row justify-content-sm-end gap-2">

                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
<button type="submit" class="btn btn-primary">
                                        Agregar centro
                                    </button>

                                </div>

                            <div class="alert alert-danger d-none mt-3 mb-0" data-alta-error role="alert"></div>
</form>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal para ver los datos -->
    <div class="modal fade" id="datosCentro" tabindex="-1" aria-hidden="true">

        <div class="modal-dialog modal-dialog-scrollable">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Datos del Centro
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="mb-3">

                        <label for="verNombreCentro" class="form-label">
                            Nombre
                        </label>

                        <input type="text" id="verNombreCentro" class="form-control" disabled>

                    </div>

                    <div class="mb-3">

                        <label for="verDireccionCentro" class="form-label">
                            Dirección
                        </label>

                        <input type="text" id="verDireccionCentro" class="form-control" disabled>

                    </div>

                    <div class="mb-3">

                        <label for="verCapacidadCentro" class="form-label">
                            Capacidad
                        </label>

                        <input type="number" id="verCapacidadCentro" class="form-control" min="0.01" step="0.01" disabled>

                    </div>

                    <div class="mb-3">

                        <label for="verTipoCentro" class="form-label">
                            Tipo
                        </label>

                        <select id="verTipoCentro" class="form-select" disabled>

                            <option value="Central Operativa">
                                Central Operativa
                            </option>

                            <option value="Centro de acopio">
                                Centro de acopio
                            </option>

                            <option value="Punto de depósito">
                                Punto de depósito
                            </option>

                            <option value="Vertedero">
                                Vertedero
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label for="verUbicacionX" class="form-label">
                            Ubicación X
                        </label>

                        <input type="number" id="verUbicacionX" class="form-control" disabled step="any">

                    </div>

                    <div class="mb-3">

                        <label for="verUbicacionY" class="form-label">
                            Ubicación Y
                        </label>

                        <input type="number" id="verUbicacionY" class="form-control" disabled step="any">

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                        Cerrar

                    </button>

                    <button type="button" id="btnGuardarCentro" class="btn btn-success d-none">

                        Guardar cambios

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous">
    </script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- JavaScript del proyecto -->
    <script src="assets/script.js?v=centros-crud-20261011-1"></script>

</body>

</html>
