<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listado Contenedores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/style.css?v=mobile-20261011-1">

</head>

<body class="d-flex flex-column">

    <div id="navbar-container"></div>

    <main class="container px-2 px-sm-3 pb-4">

        <h2 class="text-center">CONTENEDORES</h2>

        <div class="d-grid d-sm-flex justify-content-sm-end mb-3"><button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#altaContenedorModal">Agregar contenedor</button></div>
        <!-- barra de busqueda -->
        <nav class="navbar bg-body-tertiary">

            <div class="container-fluid justify-content-center">

                <form id="formBusquedaContenedores" class="d-flex flex-column flex-sm-row gap-2 col-12 col-md-8 col-lg-6 p-0" role="search">

                    <input
                        id="inputIdContenedor"
                        class="form-control"
                        type="search"
                        placeholder="ID Contenedor"
                        aria-label="ID Contenedor"
                    >

                    <button
                        id="buscarContenedores"
                        class="btn btn-outline-success"
                        type="submit">
                        Buscar
                    </button>

                </form>

            </div>

        </nav>


        <!-- Tabla -->

        <div class="table-responsive" tabindex="0" role="region" aria-label="Listado con desplazamiento horizontal">
<table class="table table-hover">

            <thead>

                <tr>

                    <th scope="col">ID</th>

                    <th scope="col">TIPO</th>

                    <th scope="col">ESTADO</th>

                    <th scope="col">NIVEL LLENADO</th>

                    <th scope="col">UBICACIÓN X</th>

                    <th scope="col">UBICACIÓN Y</th>

                    <th scope="col">RUTA</th>

                </tr>

            </thead>

            <tbody id="tablaContenedores">

                <!-- Cargaremos los datos mediante API -->

            </tbody>

        </table>
</div>

    </main>

    <div class="modal fade" id="altaContenedorModal" tabindex="-1" aria-labelledby="altaContenedorModalLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h2 class="modal-title fs-5" id="altaContenedorModalLabel">Agregar contenedor</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-start">
<form data-alta="altaContenedor" id="formContenedor" method="POST" action="http://localhost:8000/api/contenedores">

                                <div class="row">
                                    <div class="col-12 col-md-6 mb-3">
                                        <label for="altaContenedor_ubicacionX" class="form-label">
                                            Ubicación X
                                        </label>

                                        <input type="number" class="form-control" id="altaContenedor_ubicacionX" name="ubicacionX"
                                            placeholder="Ej: -56.1342" min="-99.9999" max="99.9999" step="0.0001" required>
                                    </div>

                                    <div class="col-12 col-md-6 mb-3">
                                        <label for="altaContenedor_ubicacionY" class="form-label">
                                            Ubicación Y
                                        </label>

                                        <input type="number" class="form-control" id="altaContenedor_ubicacionY" name="ubicacionY"
                                            placeholder="Ej: -34.8981" min="-99.9999" max="99.9999" step="0.0001" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-12 col-md-6 mb-3">
                                        <label for="altaContenedor_estado" class="form-label">
                                            Estado
                                        </label>

                                        <select class="form-select" id="altaContenedor_estado" name="estado" required>
                                            <option value="" selected disabled> Seleccione estado</option>
                                            <option value="Disponible">Disponible</option>
                                            <option value="En mantenimiento">En mantenimiento</option>
                                            <option value="Inhabilitado">Inhabilitado</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-6 mb-3">
                                        <label for="altaContenedor_nivelLlenado" class="form-label">
                                            Nivel de llenado
                                        </label>

                                        <div class="input-group">
                                            <input type="number" class="form-control" id="altaContenedor_nivelLlenado"
                                                name="nivelLlenado" value="0" min="0" max="0" readonly required>
                                            <span class="input-group-text">%</span>
                                        </div>
                                    </div>
                                </div>


                                <div class="mb-3">
                                    <label for="altaContenedor_tipoResiduo" class="form-label">
                                        Tipo de residuo
                                    </label>

                                    <select class="form-select" id="altaContenedor_tipoResiduo" name="tipoResiduo" required>
                                        <option value="" selected disabled> Seleccione el tipo de residuo </option>
                                        <option value="Mixtos">Mixtos</option>
                                        <option value="Reciclables">Reciclables</option>
                                    </select>
                                </div>


                                <div class="mb-4">
                                    <label for="altaContenedor_idRuta" class="form-label">
                                        Ruta asignada
                                    </label>

                                    <select class="form-select" id="altaContenedor_idRuta" name="idRuta">
                                        <option value="" selected>Sin ruta asignada</option>
                                    </select>
                                    <div id="altaContenedor_mensajeRutas" class="form-text"></div>
                                </div>


                                <div class="d-flex flex-column flex-sm-row justify-content-sm-end gap-2">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
<button type="submit" class="btn btn-primary">
                                        Agregar contenedor
                                    </button>
                                </div>

                            <div class="alert alert-danger d-none mt-3 mb-0" data-alta-error role="alert"></div>
</form>
                </div>
            </div>
        </div>
    </div>



    <script src="assets/script.js?v=flota-20261011-1"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>


</body>

</html>
