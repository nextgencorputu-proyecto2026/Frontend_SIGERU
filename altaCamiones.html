<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta Camiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./assets/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

</head>

<body class="d-flex flex-column">
    
    <div id="navbar-container"></div>

    <main class="container">

        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">

                    <div class="card shadow">
                        <div class="card-header bg-success text-white">
                            <h2 class="h4 mb-0">Agregar camión</h2>
                        </div>

                        <div class="card-body">
                            <form id="formCamion" method="POST" action="#">

                                <div class="row">

                                    <div class="col-md-6 mb-3">
                                        <label for="matricula" class="form-label">
                                            Matrícula
                                        </label>

                                        <input type="text" class="form-control" id="matricula" name="matricula" placeholder="AAA123" required>
                                    </div>


                                    <div class="col-md-6 mb-3">
                                        <label for="marca" class="form-label">
                                            Marca
                                        </label>

                                        <input type="text" class="form-control" id="marca" name="marca" placeholder="Marca" required>
                                    </div>
                                </div>

                                <div class="row">

                                    <div class="col-md-6 mb-3">
                                        <label for="estado" class="form-label">
                                            Estado
                                        </label>

                                        <select class="form-select" id="estado" name="estado" required>
                                            <option value="" selected disabled>Seleccione un estado </option>
                                            <option value="Disponible">Disponible</option>
                                            <option value="En servicio">En servicio</option>
                                            <option value="En mantenimiento"> En mantenimiento </option>
                                            <option value="Fuera de servicio"> Fuera de servicio </option>
                                        </select>
                                    </div>


                                    <div class="col-md-6 mb-3">
                                        <label for="tipo" class="form-label">
                                            Tipo de camión
                                        </label>

                                        <select class="form-select" id="tipo" name="tipo" required>

                                            <option value="" selected disabled>Seleccione un tipo </option>

                                            <option value="Reecolector Generales">Reecolector Generales</option>
                                            <option value="Recolector Reciclables">Recolector Reciclables</option>
                                            <option value="Transortador">Transortador</option>

                                        </select>
                                    </div>
                                </div>


                                <div class="mb-4">
                                    <label for="capacidad" class="form-label">
                                        Capacidad
                                    </label>

                                    <div class="input-group">
                                        <input type="number" class="form-control" id="capacidad" name="capacidad" placeholder="Ingrese la capacidad" required>
                                        <span class="input-group-text">kg</span>
                                    </div>
                                </div>


                                <div class="d-flex justify-content-end gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        Agregar camión
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <script src="assets/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


</body>

</html>
