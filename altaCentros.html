<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alta Centros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous">

    <link rel="stylesheet" href="./assets/style.css">

</head>

<body class="d-flex flex-column">

    <div id="navbar-container"></div>

    <main class="container">

        <div class="container py-4">

            <div class="row justify-content-center">

                <div class="col-12 col-md-10 col-lg-8">

                    <div class="card shadow">

                        <div class="card-header bg-success text-white">

                            <h2 class="h4 mb-0">
                                Agregar centro
                            </h2>

                        </div>

                        <div class="card-body">

                            <form id="formCentro" method="POST"
                                action="http://localhost:8000/api/centros-acopio">

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label for="nombre" class="form-label">
                                            Nombre
                                        </label>

                                        <input type="text"
                                            class="form-control"
                                            id="nombre"
                                            name="nombre"
                                            placeholder="Nombre del centro"
                                            maxlength="60"
                                            required>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label for="direccion" class="form-label">
                                            Dirección
                                        </label>

                                        <input type="text"
                                            class="form-control"
                                            id="direccion"
                                            name="direccion"
                                            placeholder="Dirección"
                                            maxlength="120"
                                            required>

                                    </div>

                                </div>


                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label for="capacidad" class="form-label">
                                            Capacidad
                                        </label>

                                        <div class="input-group">

                                            <input type="number"
                                                class="form-control"
                                                id="capacidad"
                                                name="capacidad"
                                                placeholder="Ingrese la capacidad"
                                                min="0.01"
                                                step="0.01"
                                                required>

                                            <span class="input-group-text">
                                                kg
                                            </span>

                                        </div>

                                    </div>


                                    <div class="col-md-6 mb-3">

                                        <label for="tipo" class="form-label">
                                            Tipo de centro
                                        </label>

                                        <select class="form-select"
                                            id="tipo"
                                            name="tipo"
                                            required>

                                            <option value="" selected disabled>
                                                Seleccione un tipo
                                            </option>

                                            <option value="Central Operativa">
                                                Central Operativa
                                            </option>

                                            <option value="Centro de acopio">
                                                Centro de acopio
                                            </option>

                                            <option value="Punto de depósito">
                                                Punto de depósito
                                            </option>

                                            <option value="Vertedero">
                                                Vertedero
                                            </option>

                                        </select>

                                    </div>

                                </div>


                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label for="ubicacionX" class="form-label">
                                            Ubicación X
                                        </label>

                                        <input type="number"
                                            class="form-control"
                                            id="ubicacionX"
                                            name="ubicacionX"
                                            placeholder="Ej: -34.8897"
                                            step="any"
                                            required>

                                    </div>


                                    <div class="col-md-6 mb-3">

                                        <label for="ubicacionY" class="form-label">
                                            Ubicación Y
                                        </label>

                                        <input type="number"
                                            class="form-control"
                                            id="ubicacionY"
                                            name="ubicacionY"
                                            placeholder="Ej: -56.0960"
                                            step="any"
                                            required>

                                    </div>

                                </div>


                                <div class="d-flex justify-content-end gap-2">

                                    <button type="submit" class="btn btn-primary">
                                        Agregar centro
                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script src="assets/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>

</html>
